<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="50%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
  </defs>
  <!-- Fondo redondeado -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Anillo decorativo -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.7"/>
  <!-- Letras TIG -->
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
        fill="white" text-anchor="middle" letter-spacing="1">TIG</text>
</svg>
