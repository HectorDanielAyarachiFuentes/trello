<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIG – Gestión Académica</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-left">
      <div class="avatar-wrapper">
        <img src="assets/img/Dulce 3.jpg" alt="Dulce" class="avatar" />
        <div class="avatar-ring"></div>
      </div>
      <div class="header-info">
        <h1 class="header-title">TIG – Gestión Académica</h1>
        <p class="header-sub">Ciclo de Consignas &amp; CURZAS</p>
      </div>
    </div>

    <!-- ===== TABS NAV ===== -->
    <nav class="tabs-nav" role="tablist">
      <button class="tab-btn active" id="tab-pdf"    role="tab" aria-selected="true"  onclick="switchTab('pdf')">
        <span class="tab-icon">📄</span> PDF
      </button>
      <button class="tab-btn"        id="tab-video"  role="tab" aria-selected="false" onclick="switchTab('video')">
        <span class="tab-icon">🎬</span> Video
      </button>
      <button class="tab-btn"        id="tab-trello" role="tab" aria-selected="false" onclick="switchTab('trello')">
        <span class="tab-icon">📋</span> Trello
      </button>
    </nav>
  </header>

  <!-- ===== CONTENT PANELS ===== -->
  <main class="content">

    <!-- PDF Panel -->
    <section class="panel active" id="panel-pdf" role="tabpanel">
      <div class="panel-inner">
        <div class="embed-wrapper pdf-wrapper">
          <iframe
            src="assets/docs/Actividad 5 - Organizacion Academica Trello.pdf"
            title="Actividad 5 - Organización Académica Trello"
            class="embed-frame"
          ></iframe>
        </div>
        <a class="download-btn" href="assets/docs/Actividad 5 - Organizacion Academica Trello.pdf" download>
          ⬇️ Descargar PDF
        </a>
      </div>
    </section>

    <!-- Video Panel -->
    <section class="panel" id="panel-video" role="tabpanel">
      <div class="panel-inner">
        <div class="embed-wrapper video-wrapper">
          <video controls class="embed-frame video-player">
            <source src="assets/media/Actividad 5 - Video Explicativo Trello.mp4" type="video/mp4" />
            Tu navegador no soporta la reproducción de video.
          </video>
        </div>
      </div>
    </section>

    <!-- Trello Panel -->
    <section class="panel" id="panel-trello" role="tabpanel">
      <div class="panel-inner trello-panel-inner">
        <div class="trello-card">
          <div class="trello-logo">📋</div>
          <h2 class="trello-card-title">TIG – Gestión Académica</h2>
          <p class="trello-card-sub">Ciclo de Consignas &amp; CURZAS</p>
          <a
            class="trello-open-btn"
            href="https://trello.com/invite/b/6aa0709e40308d5a7c1377f6/ATTI3c945e76e1dab1d55c9310833b261dd0F7810381/tig-gestion-academica-ciclo-de-consignas-curzas"
            target="_blank"
            rel="noopener noreferrer"
          >
            Abrir tablero en Trello →
          </a>
        </div>
      </div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
